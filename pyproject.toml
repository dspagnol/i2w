[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
    ]
build-backend = "setuptools.build_meta"

[project]
name = "i2w"
authors = [
    { name="Daniel Spagnol", email="dspagnol@gmail.com" },
    ]
description = "Integer to words. Given an integer, i2w outputs it as words."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    ]
dynamic = [
    "optional-dependencies",
    "version",
    ]

[project.scripts]
i2w = "i2w.cli:main"

[tool.setuptools.dynamic]
optional-dependencies.dev = { file = ["scripts/requirements-dev.in"] }
version = { attr = "i2w.__version__" }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "D",   # pydocstyle (docstrings)
    "I",   # isort (import sorting)
]
ignore = [
    "D104",  # Missing docstring in public package
    "D100",  # Missing docstring in public module (we'll add these)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)
'''
