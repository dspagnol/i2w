[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
    ]
build-backend = "setuptools.build_meta"

[project]
name = "i2w"
authors = [
    { name="Daniel Spagnol", email="dspagnol@gmail.com" },
    ]
description = "Convert integers to words in multiple languages (e.g., English, Spanish) with flexible number system handling."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    ]
dynamic = [
    "optional-dependencies",
    "version",
    ]

[project.scripts]
i2w = "i2w.cli:main"

[tool.setuptools.dynamic]
optional-dependencies.dev = { file = ["scripts/requirements-dev.in"] }
version = { attr = "i2w.__version__" }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins (shadowing builtins)
    "ANN",  # flake8-annotations (type annotations)
    "ARG",  # flake8-unused-arguments
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "COM",  # flake8-commas
    "D",    # pydocstyle (docstrings)
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "PERF", # perflint (performance anti-patterns)
    "PIE",  # flake8-pie
    "PLR",  # pylint refactor
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade (modern Python syntax)
    "W",    # pycodestyle warnings
]
ignore = [
    # Docstring related
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    # Annotation related (we'll add progressively)
    "ANN001", # Missing type annotation for function argument
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    # Other exceptions
    "N818",   # Exception naming (backward compat for public exceptions)
    "PLR0915", # Too many statements (acceptable for complex initialization)
    "PLR2004", # Magic value used in comparison
    "RUF001",  # Ambiguous unicode character
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",   # Type annotations not critical in tests
    "D",     # Docstrings not required in test code
    "E501",  # Line length less critical in test code
    "I",     # Import sorting less critical in test code
    "SIM108", # Ternary operator preference not critical in tests
]
"**/__init__.py" = [
    "F401",  # Unused imports in __init__.py (often used for exports)
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = "venv"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)
'''
